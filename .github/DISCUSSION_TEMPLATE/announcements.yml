body:
  - type: markdown
    attributes:
      value: Announcements are posted by maintainers. Say what changed, which boards it affects and what to do.
  - type: textarea
    id: what
    attributes:
      label: What changed
    validations:
      required: true
  - type: input
    id: boards
    attributes:
      label: Boards and revisions
      placeholder: board-bmp581-breakout rev A1
  - type: textarea
    id: action
    attributes:
      label: What users should do

body:
  - type: input
    id: board
    attributes:
      label: Board, library or block
      description: What the idea is for, or "new" for something that does not exist yet.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you today. Who else has it?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: The change or the design you have in mind. Sketches and links help.

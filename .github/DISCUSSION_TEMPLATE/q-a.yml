body:
  - type: markdown
    attributes:
      value: |
        Ask how to use or build a board. A defect you can reproduce goes in an issue in the board's repository, and a
        vulnerability goes through SECURITY.md, never here.
  - type: input
    id: board
    attributes:
      label: Board, library or block, and version
      description: Repository and tag or commit, and the revision if you hold a built board.
      placeholder: board-bmp581-breakout rev A0
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: MCU, driver version, KiCad version, test equipment.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you are trying to do, what you tried, and what you saw or measured.
    validations:
      required: true
